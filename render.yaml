services:
  - type: web
    name: thefarmgate
    env: node
    plan: free
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Set these in the Render dashboard — do not put secrets in this file
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false   # e.g. https://thefarmgate.onrender.com

      # SendGrid SMTP — EMAIL_PASS set in dashboard
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        value: apikey
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false   # e.g. The Farm Gate <noreply@yourdomain.com>
